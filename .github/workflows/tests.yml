name: Test Yawmiyat

on:
  push:
    branches:
      - review/initial-yawmiyat
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # On pull_request, checkout the PR merge ref by default; do not pin a branch.
      - name: Check out tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        env:
          # No DATABASE_URL is supplied: every test fixture must configure its own tmp_path SQLite DB.
          COOKIE_SECURE: "0"
        run: pytest -q
